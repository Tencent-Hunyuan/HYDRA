# ==============================================================================
# HYDRA 1.5b training - stage 3: quality refinement
# ==============================================================================
wandb:
  entity: null
  resume: 'auto'

experiment:
    project: "HYDRA-new-kl"
    name: "hydra-1.5b-stage-3-kl-1.0-nf"
    # The released ckpt/hydra_1.5b was produced by this stage with the full
    # stage-3 T2I mixture -- the same recipe as the 7B (configs/hydra_7b_stage3.yaml),
    # which additionally draws on BLIP3o-60k, OpenGPT-4o and ShareGPT4o on top of
    # the base sources. Those source paths are internal and appear below only as
    # `/path/to/...` placeholders: fill in `dataset.params.train_t2i_shards_path_or_url`
    # with your own equivalents. This config is a template for the recipe, not a
    # byte-exact reproduction of the released checkpoint.
    output_dir: "/path/to/checkpoint/hydra-1.5b-stage-3-final"
    output_dataloader_state_dir: "64gpus_dataloader_states"
    max_train_examples_t2i: 66000000
    max_train_examples_mmu: 66000000
    save_every: 1000
    generate_every: 5000
    log_every: 50
    log_grad_norm_every: 500
    resume_from_checkpoint: 'latest'

model:
    vae_model:
        type: "hydra_tok"

    hydra_tok_model:
        hydra_tok_config: "./models/hydra_tok"
        pretrained_model_path: "/path/to/checkpoint/hydra_tok_pretrain_ckpt/hydra-tok-stage2-64c-kl-no-cls-40M_final_model"
        latent_stats_path: "/path/to/HYDRA-TOK/stats/hydra-tok-stage2-64c-kl-no-cls-40M_latent_stats.pt"

    llm:
        model_name: "HYDRA"
        load_from_llm: False
        pretrained_model_path: ""
        llm_model_path: "Qwen/Qwen2.5-1.5B-Instruct"
        llm_vocab_size: null # will be updated when setting the tokenizer in other code files
        hidden_size: 1536
        image_latent_dim: 64
        image_latent_height: 32
        image_latent_width: 32
        hq_image_latent_height: 32
        hq_image_latent_width: 32
        mixed_modal_latent_height: 32
        mixed_modal_latent_width: 32
        patch_size: 1
        num_diffusion_layers: 10
        add_qk_norm: True
        add_time_embeds: True
        frozen_params: null
        params_not_load: null

dataset:
    samp_probs: null
    accumulation: 1
    mixed_loader_mode: "concat_max_size_cycle"
    
    # ==================== Parquet MMU dataset configuration ====================
    # Parquet is used for MMU understanding tasks (LLaVA-One-Vision style, fast loading)
    use_parquet_mmu: false   # MMU uses the Parquet dataset (faster loading)
    
    # Path to the Parquet index JSON file
    # JSON format: {"files": [{"absolute_path": "/path/to/file.parquet"}, ...]}
    parquet_mmu_index_json: "/path/to/dataset_scan_report.json"
    
    # Parquet dataset parameters
    parquet_mmu_kwargs:
        image_col: "image"           # image column name in the parquet file
        caption_col: "caption"       # caption column name in the parquet file
        id_col: "id"                 # id column name in the parquet file
        max_files: null              # maximum number of files to load (null means loading all; set a smaller value for testing)
        prefetch_factor: 4           # prefetch factor, speeds up data loading
    
    params:
        # T2I dataset - supports multiple data sources (list format)
        train_t2i_shards_path_or_url: 
            - /path/to/t2i/dataset1/data_info.json   # add your T2I datasets here
        train_t2i_data_root: 
            - /path/to/t2i/dataset1

        # MMU data configuration - supports YAML or JSON format
        
        # YAML format supports multi-dataset loading and sampling strategies
        train_mmu_shards_path_or_url: "./datasets/example_mmu_datasets.yaml"
            # - "/path/to/data/llava_one_vision/0108_llava_onevision_merged.json"
            # - "/path/to/datasets/LLaVA-OneVision-Data/llava_processed_data/json_files/FigureQA_MathV360K.json"
        train_mmu_data_root: "/path/to/datasets/LLaVA-OneVision-Data/llava_processed_data/images"
            # - /path/to/mmu/image_root
            # - /path/to/mmu/image_root
        filter_no_image: True  # filter out records without images
        default_system_prompt: "system\nYou are a helpful assistant.<|im_end|>"
        
        is_clip_encoder: False
        add_caption_prompt: True
        validation_prompts_file: "prompts/geneval.txt"
        shuffle_buffer_size: 1000
        num_workers: 16
        pin_memory: True
        persistent_workers: True

    preprocessing:
        max_seq_length: 2048
        resolution: 448
        mixed_modal_resolution: 448
        num_t2i_image_tokens: 1024
        num_mmu_image_tokens: 1024
        num_video_tokens: 3645
        latent_height: ${model.llm.image_latent_height}
        latent_width: ${model.llm.image_latent_width}
        hq_latent_height: ${model.llm.hq_image_latent_height}
        hq_latent_width: ${model.llm.hq_image_latent_width}
        mixed_modal_latent_height: ${model.llm.hq_image_latent_height}
        mixed_modal_latent_width: ${model.llm.hq_image_latent_width}
        min_res: [256,256] # minimum image resolution
        random_und_or_gen: 0.0

optimizer:
    name: adamw
    params: # default adamw params
        # Param group 1: Und_ViT (understanding visual encoder) - pretrained model, uses a lower learning rate
        learning_rate_ve: 2e-6
        # Param group 2: semantic_proj (semantic projection layer) - newly initialized layer, uses a medium learning rate
        learning_rate_proj: 2e-5
        # Param group 3: HYDRA LLM + Diffusion Head - backbone, uses a higher learning rate
        learning_rate_llm: 2e-5
        scale_lr: False # scale learning rate by total batch size
        beta1: 0.9
        beta2: 0.999
        weight_decay: 0.01  # add slight weight decay to prevent overfitting
        epsilon: 1e-8

lr_scheduler:
    scheduler: "cosine"
    params:
        warmup_steps: 10
        min_lr: 1e-6  # minimum learning rate (final learning rate); the cosine scheduler decays the learning rate from the initial value down to this value

transport:
    path_type: "Linear"
    prediction: "velocity"
    loss_weight: null
    train_eps: null
    sample_eps: null
    snr_type: "lognorm"
    sampling_method: "euler"
    guidance_scale: 5.0
    num_inference_steps: 50
    atol: 1e-6
    rtol: 1e-3
    reverse: False
    do_shift: True
    time_shifting_factor: 3.0

training:
    use_torch_compile: True
    noise_shift: 1.0
    gradient_accumulation_steps: 1
    batch_size_t2i: 2
    batch_size_mmu: 2
    mixed_precision: "bf16"
    enable_tf32: True
    seed: 10086
    max_train_steps: 20_000
    cond_dropout_prob: 0.1
    label_smoothing: 0.0
    max_grad_norm: 1.0
    ntp_coeff: 1.0
    flow_coeff: 1.0
    stage: "tuning"
    und_max_t0: 1.0
